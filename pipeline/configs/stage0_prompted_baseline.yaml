# Stage 0 only: prompted-teacher replication of Nief et al. Figure 2 for cat at
# student ranks {4, 8, 16, 64}. Same prompt format, hyperparameters, metric and
# context as the paper. Shares results/main, so the main experiment reuses these runs.
#   python scripts/run_stage.py --config configs/stage0_prompted_baseline.yaml --stage 0
#   python scripts/make_figures.py --config configs/stage0_prompted_baseline.yaml
# Expected (Nief et al. Table 7): base 9.5%, rank 4 18.6%, rank 8 39.0%, rank 16 29.8%, rank 64 10.6%.
name: stage0_prompted_baseline
model: Qwen/Qwen2.5-7B-Instruct
backend: vllm
results_dir: results/main
animals: [cat]

seeds:
  generation: [1, 2, 3]            # Nief et al. use 6
  training: [1]
  other_role_generation: [101]
  other_role_training: [101]

stages:
  prompted_baseline: true
  neutral_control: true
  lora_teachers: false

student:
  ranks: [4, 8, 16, 64]

eval:
  samples_per_question: 200        # Nief et al. use 100; the metric is a rate, so it is comparable

budget:
  cap_gpu_hours: 40
