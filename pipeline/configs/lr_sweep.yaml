# Learning-rate sweep (answers Feng 2026, "Subliminal learning happens at every rank,
# given the right learning rate"): does the inverted U over student rank survive
# when the learning rate is chosen per rank, for prompted AND fine-tuned teachers?
# Full grid: every student rank of the main experiment x 6 learning rates
# (4x below to 8x above the default), 336 students.
#
# The learning rate is picked per rank by fit to held-out numbers (heldout_loss),
# never by transfer (and, as in Feng 2026, by transfer, cross-validated over seeds).
# Reuses the datasets and verified teachers of the main experiment (see README):
#   bash scripts/run_local.sh configs/lr_sweep.yaml <gpu> <shard> 2
name: lr_sweep
model: Qwen/Qwen2.5-7B-Instruct
backend: vllm
results_dir: results/lr_sweep
animals: [cat, eagle]

context:
  system_prompt: "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."

seeds:
  generation: [1, 2]
  training: [1]
  eval: 0
  role: confirmation
  other_role_generation: [101]
  other_role_training: [101]

stages:
  prompted_baseline: true
  neutral_control: false
  lora_teachers: true

generation:
  prompt_format: cloud             # Cloud et al.'s prompts: the prototype reproduced Nief et al.'s curve with these
  n_valid: 10000
  temperatures: [1.0]              # list several values for a temperature sweep
  filter:
    exact_three_digits: false      # 0-999, as in Cloud et al. and the prototype
    separators: null               # any consistent whitespace, comma or semicolon separator

teacher:
  variants:
    - name: lora
      sft_questions: disjoint
      sft_answers: prompted_samples
      ranks: [16]

student:
  ranks: [1, 2, 4, 8, 16, 64, 128]
  alpha_over_r: 1.0
  train: {lr: 2.0e-4, epochs: 3, batch_size: 22, grad_accum: 3, warmup_steps: 5}
  heldout_examples: 500
  adapter_dtype: float32           # a441 has room; set bfloat16 to halve disk use on a full machine
  sweep:                           # same grid at every rank (low ranks may need larger, high ranks smaller)
    - {lr: 5.0e-5}
    - {lr: 1.0e-4}
    - {lr: 2.0e-4}                 # default (Nief et al.)
    - {lr: 4.0e-4}
    - {lr: 8.0e-4}
    - {lr: 1.6e-3}

eval:
  samples_per_question: 100
  temperature: 1.0

budget:
  cap_gpu_hours: 200
  costs:                           # measured on a441 (RTX 5090): ~25 min per student
    dataset_generation: 0.10
    student_training: 0.42
    student_eval: 0.03
    teacher_sft_data: 0.05
    teacher_training: 0.15
    teacher_verification: 0.15
    base_eval: 0.10
